<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma de Avaliação Quantitativa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: cabeçalho azul-marinho com escalão, momento e três separadores; por baixo, registo à esquerda e leitura (perfil, evolução) à direita, empilhados no telemóvel */
:root{
  --bg:#FFFFFF; --surface:#F4F7FB; --ink:#14274E; --muted:#56678A; --line:#D3DCE9;
  --accent:#E8641B; --accent-ink:#FFFFFF; --head:#14274E; --head-ink:#FFFFFF; --sky:#D9EAF9; --warn:#B3261E; --good:#1F7A4D;
  --l1:#D6E6F7; --l2:#A6C8EC; --l3:#6C9FD6; --l4:#35689F; --l5:#14274E;
  --t1:#14274E; --t2:#14274E; --t3:#14274E; --t4:#FFFFFF; --t5:#FFFFFF;
  --font-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --font-b:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A2E; --surface:#172642; --ink:#E8EDF5; --muted:#9FB0C9; --line:#2A3C5E;
    --accent:#FF8A3D; --accent-ink:#14274E; --head:#0B1424; --head-ink:#E8EDF5; --sky:#1E3559; --warn:#FF8A80; --good:#6FD3A0;
    --l1:#27406A; --l2:#3F679F; --l3:#6C9FD6; --l4:#A6C8EC; --l5:#E3EEFA;
    --t1:#E8EDF5; --t2:#E8EDF5; --t3:#0B1424; --t4:#0B1424; --t5:#0B1424; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A2E; --surface:#172642; --ink:#E8EDF5; --muted:#9FB0C9; --line:#2A3C5E;
  --accent:#FF8A3D; --accent-ink:#14274E; --head:#0B1424; --head-ink:#E8EDF5; --sky:#1E3559; --warn:#FF8A80; --good:#6FD3A0;
  --l1:#27406A; --l2:#3F679F; --l3:#6C9FD6; --l4:#A6C8EC; --l5:#E3EEFA;
  --t1:#E8EDF5; --t2:#E8EDF5; --t3:#0B1424; --t4:#0B1424; --t5:#0B1424; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-b)}
h1,h2,h3{font-family:var(--font-d);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:1.7rem} h2{font-size:1.45rem;margin-bottom:.6rem} h3{font-size:1.15rem;margin:0}
p{margin:.4rem 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.875rem}

header.top{background:var(--head);color:var(--head-ink);padding:1rem 16px 0}
.top-in,.wrap{max-width:1120px;margin:0 auto}
.top-row{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:flex-end;justify-content:space-between}
.brand{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;min-width:0}
.logos{display:flex;gap:.5rem}
.logos img{display:block;height:60px;width:auto;background:#fff;border-radius:8px;padding:5px}
.top .team{opacity:.8;font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
#status{font-size:.8rem;opacity:.75;min-height:1.2em;margin-top:.25rem}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:inherit;padding:.4rem .8rem;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.on-page{border-color:var(--line)}
.top select{background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.4rem .7rem;color:inherit;font-weight:600}
.top select option{color:#14274E;background:#fff}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:.45rem .85rem;cursor:pointer;font-weight:600}
.hbtn:hover{border-color:var(--head-ink)}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flash{display:flex;flex-wrap:wrap;gap:.5rem .75rem;align-items:center;justify-content:space-between}
@media print{
  header.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ctl,.acts,#status,nav.tabs,.btn,.link[data-act="desc"],.tries input[value=""]{display:none!important}
  main{padding:0}
  .card{break-inside:avoid;border-color:#ccc}
  .chip,.strip span,.dist .bar span{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
nav.tabs{display:flex;gap:.25rem;margin-top:.9rem;overflow-x:auto}
nav.tabs button{background:none;border:0;color:inherit;opacity:.75;padding:.6rem .9rem;cursor:pointer;font-weight:600;border-bottom:4px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{opacity:1;border-bottom-color:var(--accent)}

main{padding:1.25rem 16px 3rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem;margin-bottom:1rem;min-width:0}
.cols{display:grid;gap:1rem;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
.cols>div{min-width:0}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:.5rem .75rem;align-items:center}
.row.end{align-items:flex-end}
.between{justify-content:space-between}
.fld{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .85rem;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;max-width:100%}
textarea{width:100%;min-height:5rem;resize:vertical}
label{font-weight:600;font-size:.85rem}
.scroll{overflow-x:auto}
.notice{border-left:4px solid var(--accent);padding:.5rem .8rem;background:var(--sky);border-radius:0 8px 8px 0;margin:.6rem 0}
details summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:.9rem}
details ul{margin:.4rem 0;padding-left:1.2rem;font-size:.9rem}

table.grid{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
table.grid th:first-child,table.grid td:first-child{text-align:left}
table.grid thead th{font-weight:600;color:var(--muted);line-height:1.2}
table.grid tfoot td{font-weight:600}
table.grid .rn{font-family:var(--font-d);color:var(--accent);font-size:1.05rem;display:block}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.chip{display:inline-block;border-radius:999px;padding:.05rem .5rem;font-size:.78rem;font-weight:600;white-space:nowrap}
.chip.big{font-size:.9rem;padding:.15rem .65rem}
.chip.none{border:1px dashed var(--muted);color:var(--muted);font-weight:500;white-space:normal}
.g1{background:var(--l1);color:var(--t1)} .g2{background:var(--l2);color:var(--t2)} .g3{background:var(--l3);color:var(--t3)} .g4{background:var(--l4);color:var(--t4)} .g5{background:var(--l5);color:var(--t5)}
.key{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.8rem;color:var(--muted);margin:.5rem 0 0;padding:0;list-style:none}
.key i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;vertical-align:-1px;margin-right:.3rem}

.test{padding:.9rem 0;border-top:1px solid var(--line)}
.test .rn{font-family:var(--font-d);font-weight:700;color:var(--accent);margin-right:.35rem}
.tries{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.tries input{width:7.5rem}
.res{display:flex;flex-wrap:wrap;gap:.3rem 1.4rem;align-items:flex-end;margin-bottom:.5rem}
.res div>span:first-child{display:block;font-size:.78rem;color:var(--muted)}
.res div b{font-family:var(--font-d);font-size:1.3rem}

.prof{display:grid;gap:.7rem}
.prof .pl{display:flex;justify-content:space-between;gap:.5rem;font-size:.875rem;font-weight:600}
.prof .pl em{font-style:normal;font-weight:500;color:var(--muted);text-align:right}
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;height:1rem;margin-top:.2rem}
.strip span{background:var(--line);border-radius:2px}
.strip span.on{background:var(--accent)}
.strip.none span{background:none;border:1px dashed var(--line)}
.axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.up{color:var(--good);font-weight:600}
.dist{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:.5rem .7rem;align-items:center;font-size:.875rem}
@media (max-width:520px){.dist{grid-template-columns:minmax(0,1fr)}}
.dist .bar{display:flex;gap:2px;min-height:1.4rem}
.dist .bar span{border-radius:3px;min-width:1.3rem;font-size:.75rem;font-weight:600;display:flex;align-items:center;justify-content:center}
.dist .bar .nr{border:1px dashed var(--muted);color:var(--muted)}
.tdoc h2 .rn{color:var(--accent)}
.tdoc h3{color:var(--accent);margin:1rem 0 .3rem}
.tdoc ul{margin:.2rem 0;padding-left:1.2rem}
.tdoc li,.tdoc p{max-width:72ch}
.tdoc a{color:inherit;font-weight:600;text-decoration-color:var(--accent);text-underline-offset:3px}
.tcols{display:grid;gap:.5rem 1.25rem;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
@media (max-width:860px){.tcols{grid-template-columns:minmax(0,1fr)}}
.tcols>div{min-width:0}
.tdoc figure{margin:1rem 0 0}
.tdoc figure img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.tdoc figcaption{font-size:.8rem;color:var(--muted);margin-top:.3rem}
.report h3{color:var(--accent);margin:1.1rem 0 .4rem}
.report .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.3rem 1rem;font-size:.9rem;margin:.5rem 0}
.report .meta span{color:var(--muted);display:block;font-size:.78rem}
.report ul{padding-left:1.2rem;margin:.3rem 0}
.report p,.report li{max-width:72ch}
</style>
</head>

const DOC={"t1": {"cap": "Percurso A-B-C-D-E-F-A na área restritiva (2,90 m e 5,80 m).", "sec": [["Descrição do teste", ["O teste é realizado dentro dos limites da linha de lance livre, atrás do cesto, e das linhas da área de ressalto.", "Os marcadores centrais da área de ressalto servem como alvos C e F. Além disso, devem ser marcados com fita adesiva quatro pontos nos cantos do retângulo delimitado: A, B, D e E.", "Trajetória: A-B-C-D-E-F-A.", "O atleta inicia o teste no ponto A, de costas para o cesto. Ao sinal de partida («Ready, go»), desloca-se lateralmente para a esquerda, sem cruzar os pés, até ao ponto B, onde toca o chão fora da área com a mão esquerda.", "Em seguida, executa um drop step e desliza até ao ponto C, tocando o chão fora da área com a mão direita.", "O percurso continua conforme indicado na figura até que ambos os pés cruzem a linha de chegada."]], ["Procedimento", ["Cada atleta realiza três tentativas cronometradas.", "O tempo de recuperação entre as tentativas é de 5 minutos.", "O melhor tempo registado é considerado para análise."]]], "links": []}, "t2": {"cap": "Seis cones na área de lance livre; partida em A e chegada junto a C.", "sec": [["Descrição do teste", ["Seis cones são dispostos na área do lance livre de um campo de basquetebol para servir como obstáculos.", "Ao sinal «Pronto, vai», o executante começa a driblar com a mão não dominante do lado não dominante do ponto A até ao lado não dominante do ponto B (drible com a mão esquerda).", "O percurso segue o traçado indicado na figura."]], ["Procedimento", ["Três tentativas cronometradas são realizadas.", "O tempo de recuperação entre as tentativas é de 5 minutos.", "O melhor resultado é utilizado para análise. Conta o tempo."]]], "links": []}, "t3": {"cap": "Cinco posições de lançamento a 2,74 m do cesto.", "sec": [["Descrição do teste", ["Lançamento em tabela de minibasquete a 2,60 m, a partir de 5 posições definidas a uma distância de 2,74 metros.", "Cada praticante tem 1 minuto.", "Só passa para a posição seguinte quando marcar na anterior."]], ["Resultado", ["Regista-se o total de pontos marcados durante o minuto."]]], "links": []}, "t4": {"cap": "Percurso de 10 m com os pontos de mudança de direção A a F.", "sec": [["Descrição do percurso", ["O percurso tem aproximadamente 10 metros de comprimento entre a zona inicial e a zona final, com os pontos de mudança de direção identificados pelas letras A, B, C, D e E. O jogador inicia em A.", "A sequência do percurso é: A → B → C → D → E → D → C → B → F (chegada). O jogador não percorre simplesmente os 10 metros em linha reta: tem de realizar sucessivas mudanças de direção, mantendo sempre o drible.", "O atleta realiza o percurso Illinois enquanto dribla a bola, procurando completar todo o circuito no menor tempo possível. O tempo é iniciado e terminado através de sinal sonoro do treinador."]], ["Procedimento", ["Cada participante realiza uma tentativa.", "Se o jogador perder o controlo da bola, o teste é repetido até um máximo de três tentativas.", "Para a análise, é utilizado o melhor resultado obtido."]], ["Material", ["Campo de basquetebol.", "Percurso do Illinois Agility Test.", "Sistema de cronometragem.", "Bola de basquetebol."]], ["Resultado", ["O indicador de resultado é o tempo total, em segundos, para completar o percurso. Quanto menor o tempo, melhor o desempenho."]]], "links": []}, "t5": {"cap": "Cone B na extremidade da linha de lance livre, cone C na linha de três pontos (6,75 m), partida em A no círculo central.", "sec": [["Equipamento e material", ["Dois cones e uma bola."]], ["Preparação para o teste", ["Numa das metades do campo de basquetebol são colocados dois cones: um junto à linha de três pontos, num ângulo de 45° em relação ao plano da tabela, e outro junto à extremidade da linha de lance livre, do lado oposto.", "Um ajudante, colocado debaixo do cesto, passa a bola ao praticante."]], ["Realização do teste", ["Ao sinal, o praticante corre desde o meio-campo em direção ao cesto e, depois de receber a bola, realiza um lançamento em dois tempos.", "Após o lançamento, corre de volta até ao círculo central, toca na linha do círculo e volta a acelerar em direção ao cone colocado junto ao lado exterior da linha de lance livre.", "Depois de receber a bola, realiza um lançamento em suspensão e corre novamente até ao círculo central, tocando na sua linha.", "De seguida, acelera novamente em direção ao cone colocado junto à linha de três pontos. Depois de receber a bola, realiza um lançamento ao cesto e regressa ao círculo central.", "Esta sequência de lançamentos é repetida durante 1 minuto."]], ["Resultado do teste", ["1 ponto: lançamento convertido junto ao cesto.", "2 pontos: lançamento convertido a partir da zona do cone colocado junto à linha de lance livre.", "3 pontos: lançamento convertido a partir da linha de três pontos.", "Os pontos são contabilizados pelo treinador ou pelo jogador que realiza os passes.", "O resultado final corresponde à soma total dos pontos obtidos.", "O teste é realizado duas vezes, trocando o lado de realização, sendo considerado o melhor resultado."]]], "links": [["Vídeo do teste", "https://www.youtube.com/watch?v=pvXByQzVZb0"]]}, "t6": {"cap": "Cinco cones em T: 10 m até ao cone central e 5 m para cada lado.", "sec": [["Equipamento e materiais", ["5 cones e um cronómetro."]], ["Procedimento", ["Ao sinal, o participante corre para a frente, a partir da linha final, o mais rapidamente possível até ao cone central.", "Desloca-se lateralmente, em passo de deslocamento para a direita, durante 5 m, até ao cone da direita.", "Desloca-se lateralmente, em passo de deslocamento para a esquerda, durante 10 m, até ao cone da esquerda.", "Regressa lateralmente para a direita até ao cone central.", "Finalmente, desloca-se de costas até alcançar a linha de chegada."]], ["Resultado do teste", ["Regista-se o melhor tempo obtido em duas tentativas."]]], "links": [["Projeto de origem", "https://lietuva.basketball/projektai/tikslas-60/"], ["Vídeo do teste", "https://www.youtube.com/watch?v=TOuM3FSnTWY"]]}, "t7": {"cap": "", "sec": [["Descrição do teste", ["O atleta executa um lance livre; no primeiro e no segundo lançamento, a bola é passada por um companheiro.", "Após o terceiro lançamento, o próprio atleta recupera a bola, dribla até à linha de lance livre e volta a lançar.", "Este processo é repetido até serem realizados 30 lances livres.", "O atleta deve efetuar o lançamento até 5 segundos após o momento em que o companheiro lhe passa a bola, ou após recuperar a bola e se posicionar na linha de lance livre.", "O teste é realizado uma única vez."]], ["Resultado do teste", ["Regista-se o número de lançamentos convertidos."]]], "links": [["Projeto de origem", "https://lietuva.basketball/projektai/tikslas-60/"]]}};

WZ/9bqF5Jy8jZ5x2UdgPUmug8FeAvBnw+8OjRPBXhrTtDsc5aKziC+YR/E7fedvdiTXS0AFFFFABRRRQAUUUUAf/2Q==", "r": 1.0}};
const T=Object.fromEntries(TESTS.map(t=>[t.id,t]));
const ESC={"8":"Sub-8","10":"Sub-10","12":"Sub-12","14":"Sub-14"};
const MOMS=[{id:"m1",label:"Início da época"},{id:"m2",label:"Intermédia"},{id:"m3",label:"Final da época"}];
/* Baterias por omissão: o documento apresenta I a III como bateria Sub-10/Sub-12 e IV a VII como bateria Sub-14. Para Sub-8 o documento não define bateria; fica a de Sub-10 até o treinador a ajustar. */
const DEF_BAT={"8":["t1","t2","t3"],"10":["t1","t2","t3"],"12":["t1","t2","t3"],"14":["t4","t5","t6","t7"]};
const GROUPS=["abaixo de P20","P20 a P40","P40 a P60","P60 a P80","P80 ou mais"];
const LS_KEY="paq-enb-v1";

const state={config:null,athletes:{}};
const ui={flash:"",pending:null,tab:"equipa",esc:"10",mid:"m1",aid:null,rep:"ind",confirmDel:false,msg:""};
let col=null,mode="local",dl=null;
const STANDALONE=true;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=s=>s?s.split("-").reverse().join("/"):"";
const isN=v=>typeof v==="number"&&isFinite(v);
function fmtV(t,v){if(!isN(v))return"–";if(t.unit==="s")return v.toFixed(2).replace(".",",")+" s";if(t.id==="t7")return (Math.round(v*10)/10).toString().replace(".",",")+" em 30";return (Math.round(v*10)/10).toString().replace(".",",")+" pts"}

function normalize(){
  const c=state.config||{};
  if(typeof c.team!=="string")c.team="";
  if(!c.bat)c.bat={};
  for(const e of Object.keys(ESC)){if(!Array.isArray(c.bat[e])||!c.bat[e].length)c.bat[e]=DEF_BAT[e].slice();c.bat[e]=c.bat[e].filter(id=>T[id])}
  state.config=c;
  for(const a of Object.values(state.athletes)){if(!a.evals)a.evals={};if(!ESC[a.esc])a.esc="10"}
}

/* ---------- gravação ---------- */
const timers={},busy={},again={};
function setStatus(t){$("#status").textContent=t}
function idleStatus(){setStatus(mode==="db"?"Guardado na tua conta":"Guardado só neste dispositivo")}
function save(id){
  if(mode==="local"){
    try{localStorage.setItem(LS_KEY,JSON.stringify(state));idleStatus()}catch(e){setStatus("Não foi possível guardar neste dispositivo")}
    return;
  }
  setStatus("A guardar…");clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700);
}
async function flush(id){
  if(busy[id]){again[id]=true;return}
  busy[id]=true;
  try{
    const data=id==="config"?state.config:state.athletes[id];
    if(data)await col.doc(id).set(clone(data));else await col.doc(id).delete();
    idleStatus();
  }catch(e){
    setStatus(e&&e.code==="quota_exceeded"?"Espaço cheio: apaga atletas antigos":"Não foi possível guardar. Verifica a ligação e altera de novo.");
  }
  busy[id]=false;
  if(again[id]){again[id]=false;flush(id)}
}

/* ---------- cálculos ---------- */
const bat=e=>state.config.bat[e].map(id=>T[id]);
const byEsc=e=>Object.values(state.athletes).filter(a=>a.esc===e).sort((a,b)=>a.name.localeCompare(b.name,"pt"));
const ev=(a,mid)=>a.evals[mid]||null;
function ensureEval(a,mid){if(!a.evals[mid])a.evals[mid]={date:today(),note:"",r:{}};if(!a.evals[mid].r)a.evals[mid].r={};return a.evals[mid]}
function best(a,mid,t){const e=ev(a,mid);if(!e||!e.r||!e.r[t.id])return null;const v=e.r[t.id].filter(isN);return v.length?(t.lower?Math.min(...v):Math.max(...v)):null}
function ageAt(birth,date){
  if(!birth)return null;const b=birth.split("-").map(Number),d=(date||today()).split("-").map(Number);
  let y=d[0]-b[0];if(d[1]<b[1]||(d[1]===b[1]&&d[2]<b[2]))y--;return y>=0&&y<100?y:null;
}
/* Faixa de percentil: a tabela dá um valor por decil, por isso o resultado é o intervalo entre dois decis, sem interpolação.
   ix vai de 0 (abaixo de P10) a 9 (P90 ou mais). */
function band(t,v,age){
  const r=t.ref[age];if(!r||!isN(v))return null;
  const ok=x=>t.lower?v<=x:v>=x;
  if(ok(r[0]))return{ix:9,label:"P90 ou mais"};
  for(let i=1;i<9;i++)if(ok(r[i]))return{ix:9-i,label:"P"+PCT[i]+" a P"+PCT[i-1]};
  return{ix:0,label:"abaixo de P10"};
}
function info(a,mid,t){
  const e=ev(a,mid),b=best(a,mid,t),age=ageAt(a.birth,e&&e.date);
  let bd=null,why="";
  if(b!=null){
    if(age==null)why="falta a data de nascimento";
    else if(!t.ref[age])why="sem valores de referência para "+age+" anos";
    else bd=band(t,b,age);
  }
  return{best:b,age,band:bd,why,tries:(e&&e.r&&e.r[t.id])||[]};
}
const grp=ix=>Math.floor(ix/2);
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const teamVals=(e,mid,t)=>byEsc(e).map(a=>best(a,mid,t)).filter(v=>v!=null);
const hasAny=(a,mid)=>bat(a.esc).some(t=>best(a,mid,t)!=null);
function prevMid(mid,has){const i=MOMS.findIndex(m=>m.id===mid);for(let k=i-1;k>=0;k--)if(has(MOMS[k].id))return MOMS[k].id;return null}
const mLabel=mid=>MOMS.find(m=>m.id===mid).label;
function delta(t,cur,prev){
  if(cur==null||prev==null)return null;const d=Math.round((cur-prev)*100)/100;
  const sign=d>0?"+":d<0?"−":"";const txt=sign+fmtV(t,Math.abs(d)).replace(" em 30","");
  return{d,txt:d===0?"igual":txt,better:t.lower?d<0:d>0};
}
function refAges(t){const k=Object.keys(t.ref).map(Number);return Math.min(...k)+" a "+Math.max(...k)+" anos"}

/* ---------- peças de interface ---------- */
function chip(i,big){
  if(i.best==null)return'<span class="muted">–</span>';
  if(!i.band)return`<span class="chip none${big?" big":""}" title="${esc(i.why)}">${big?esc(i.why):"sem referência"}</span>`;
  return`<span class="chip g${grp(i.band.ix)+1}${big?" big":""}">${i.band.label}</span>`;
}
function strip(i){
  let s=`<div class="strip${i.band?"":" none"}" aria-hidden="true">`;
  for(let k=0;k<10;k++)s+=`<span${i.band&&i.band.ix===k?' class="on"':""}></span>`;
  return s+"</div>";
}
function profile(a,mid){
  let s='<div class="prof">';
  for(const t of bat(a.esc)){const i=info(a,mid,t);
    s+=`<div><div class="pl"><span>${t.n}. ${esc(t.name)}</span><em>${i.best==null?"por registar":fmtV(t,i.best)+" · "+(i.band?i.band.label:esc(i.why))}</em></div>${strip(i)}</div>`}
  return s+'<div class="axis"><span>abaixo de P10</span><span>P50</span><span>P90 ou mais</span></div></div>';
}
function evolution(a){
  let s='<div class="scroll"><table class="grid"><thead><tr><th>Teste</th>'+MOMS.map(m=>`<th>${m.label}</th>`).join("")+"</tr></thead><tbody>";
  for(const t of bat(a.esc)){
    s+=`<tr><td>${t.n}. ${esc(t.name)}</td>`;
    for(const m of MOMS){const i=info(a,m.id,t),p=prevMid(m.id,x=>best(a,x,t)!=null),d=p?delta(t,i.best,best(a,p,t)):null;
      s+=`<td>${i.best==null?'<span class="muted">–</span>':fmtV(t,i.best)}${d?`<br><span class="small ${d.better?"up":"muted"}">${d.txt}${d.better?" ↑":""}</span>`:""}</td>`}
    s+="</tr>";
  }
  return s+'</tbody></table></div><p class="small muted">Por baixo de cada resultado está a diferença para o momento anterior. A seta marca uma melhoria.</p>';
}

/* ---------- vistas ---------- */
function viewEquipa(){
  const e=ui.esc,mid=ui.mid,as=byEsc(e),ts=bat(e);
  let s="";
  if(ui.msg){s+=`<p class="notice">${esc(ui.msg)}</p>`;ui.msg=""}
  s+=`<section class="card"><div class="row between"><h2>Equipa ${ESC[e]}</h2><span class="muted small">${as.length} ${as.length===1?"atleta":"atletas"} · ${mLabel(mid)}</span></div>`;
  if(!as.length){
    s+=`<p>Ainda não há atletas neste escalão. Junta o primeiro em baixo, ou carrega uma equipa de exemplo para veres a plataforma a funcionar.</p>`;
  }else{
    s+='<div class="scroll"><table class="grid"><thead><tr><th>Atleta</th><th>Idade</th>'+ts.map(t=>`<th><span class="rn">${t.n}</span>${esc(t.name)}</th>`).join("")+"</tr></thead><tbody>";
    for(const a of as){
      const age=ageAt(a.birth,(ev(a,mid)||{}).date);
      s+=`<tr><td><button class="link" data-act="open" data-id="${a.id}">${esc(a.name)}</button></td><td>${age==null?"–":age}</td>`;

    for(const [lab,f] of rows)s+=`<tr><td>${lab}</td><td></td>`+ts.map(t=>`<td>${fmtV(t,f(teamVals(e,mid,t),t))}</td>`).join("")+"</tr>";

  }

    <div class="fld"><label for="newName">Nome do atleta</label><input type="text" id="newName" autocomplete="off"></div>

  if(as.length){

    for(const t of ts){
      const c=[0,0,0,0,0];let nr=0,n=0;

      c.forEach((x,k)=>{if(x)s+=`<span class="g${k+1}" style="flex:${x}" title="${GROUPS[k]}: ${x}">${x}</span>`});
      if(nr)s+=`<span class="nr" style="flex:${nr}" title="Sem valores de referência para a idade: ${nr}">${nr}</span>`;
      s+="</div>";
    }
    s+='</div><p class="small muted">Cada número é a contagem de atletas nessa faixa. O tracejado conta atletas sem valores de referência para a idade.</p></section>';
  }

  s+=`<section class="card"><h2>Bateria ${ESC[e]}</h2>
    <p class="small muted">Escolhe os testes que aplicas neste escalão. O documento ENB apresenta os testes I a III como bateria Sub-10 e Sub-12 e os testes IV a VII como bateria Sub-14.${e==="8"?" Para Sub-8 o documento não define bateria: fica a de Sub-10 até a ajustares.":""}</p>
    <div class="scroll"><table class="grid"><thead><tr><th>Teste</th><th>Unidade</th><th>Tentativas</th><th>Valores de referência</th><th>Aplicar</th></tr></thead><tbody>`;
  for(const t of TESTS)s+=`<tr><td><label for="bat-${t.id}">${t.n}. ${esc(t.name)}</label></td><td>${t.unit==="s"?"segundos":t.unit==="pts"?"pontos":"convertidos em 30"}</td><td>${t.id==="t4"?"1 a 3":t.tries}</td><td>${refAges(t)}<br><span class="small muted">${esc(t.src)}</span></td><td><input type="checkbox" id="bat-${t.id}" data-ch="bat" data-t="${t.id}"${state.config.bat[e].includes(t.id)?" checked":""}></td></tr>`;
  s+=`</tbody></table></div>
    <div class="fld" style="margin-top:.8rem;max-width:24rem"><label for="teamName">Nome da equipa ou clube</label><input type="text" id="teamName" data-ch="team" value="${esc(state.config.team)}"></div>
  </section>`;
  return s;
}

/* ---------- relatórios: um modelo único que serve o ecrã e o PDF ---------- */
function repInd(a,mid){
  const e=ev(a,mid),ts=bat(a.esc),age=ageAt(a.birth,e&&e.date);
  const rep={title:"Relatório individual",sub:a.name,file:"relatorio-"+a.name,meta:[["Equipa",state.config.team||"–"],["Escalão",ESC[a.esc]],["Data de nascimento",fmtD(a.birth)||"–"],["Idade na avaliação",age==null?"–":age+" anos"],["Momento",mLabel(mid)],["Data da avaliação",e?fmtD(e.date):"–"]],blocks:[]};
  const rows=[],inf=[];
  for(const t of ts){const i=info(a,mid,t),p=prevMid(mid,x=>best(a,x,t)!=null),d=p?delta(t,i.best,best(a,p,t)):null;inf.push([t,i]);
    rows.push([t.n+". "+t.name,i.tries.filter(isN).map(v=>fmtV(t,v).replace(/ (s|pts|em 30)$/,"")).join(" · ")||"–",fmtV(t,i.best),i.best==null?"–":i.band?i.band.label:"sem referência ("+i.why+")",d?d.txt+(d.better?" (melhorou)":"")+" desde "+mLabel(p):"–"])}
  rep.blocks.push({h:"Resultados",head:["Teste","Tentativas","Melhor","Faixa de percentil","Evolução"],rows});
  const wb=inf.filter(x=>x[1].band),lines=[];
  if(!inf.some(x=>x[1].best!=null))lines.push("Ainda não há resultados registados neste momento de avaliação.");
  else if(wb.length>=2){
    const mx=Math.max(...wb.map(x=>x[1].band.ix)),mn=Math.min(...wb.map(x=>x[1].band.ix));
    if(mx===mn)lines.push("O atleta está na mesma faixa de percentil em todos os testes com referência: "+wb[0][1].band.label+".");
    else{
      lines.push("Faixa mais alta do perfil: "+wb.filter(x=>x[1].band.ix===mx).map(x=>x[0].name+" ("+x[1].band.label+")").join(", ")+".");
      lines.push("Faixa mais baixa do perfil, a considerar primeiro no planeamento: "+wb.filter(x=>x[1].band.ix===mn).map(x=>x[0].name+" ("+x[1].band.label+")").join(", ")+".");
    }
  }else if(wb.length===1)lines.push(wb[0][0].name+": "+wb[0][1].band.label+".");
  for(const [t,i] of inf)if(i.best!=null&&!i.band)lines.push(t.name+": resultado registado, mas "+i.why+". Acompanha-se pela evolução do próprio atleta.");
  const miss=inf.filter(x=>x[1].best==null).map(x=>x[0].name);
  if(miss.length&&miss.length<inf.length)lines.push("Por registar: "+miss.join(", ")+".");
  rep.blocks.push({h:"Leitura do perfil",list:lines});
  if(e&&e.note&&e.note.trim())rep.blocks.push({h:"Observações do treinador",list:[e.note.trim()]});
  rep.blocks.push({h:"Fontes dos valores de referência",list:ts.map(t=>t.full+". Percentis: "+t.src+", "+refAges(t)+".").concat(["A faixa de percentil situa o resultado entre dois decis da tabela, para a idade do atleta na data da avaliação. O foco é a evolução individual."])});
  return rep;
}
function repTeam(e,mid){
  const as=byEsc(e),ts=bat(e),done=as.filter(a=>hasAny(a,mid)).length;
  const rep={title:"Relatório coletivo",sub:(state.config.team?state.config.team+" · ":"")+ESC[e],file:"relatorio-equipa-"+ESC[e],meta:[["Equipa",state.config.team||"–"],["Escalão",ESC[e]],["Momento",mLabel(mid)],["Atletas avaliados",done+" de "+as.length]],blocks:[]};
  const pm=prevMid(mid,x=>as.some(a=>hasAny(a,x)));
  rep.blocks.push({h:"Resumo por teste",head:["Teste","Avaliados","Média","Melhor valor","Valor mais fraco",pm?"Média em "+mLabel(pm):"Média anterior"],rows:ts.map(t=>{const v=teamVals(e,mid,t),pv=pm?teamVals(e,pm,t):[];
    return[t.n+". "+t.name,v.length+" de "+as.length,fmtV(t,avg(v)),v.length?fmtV(t,t.lower?Math.min(...v):Math.max(...v)):"–",v.length?fmtV(t,t.lower?Math.max(...v):Math.min(...v)):"–",fmtV(t,avg(pv))]})});
  rep.blocks.push({h:"Distribuição por faixa de percentil",head:["Teste"].concat(GROUPS,["Sem referência"]),rows:ts.map(t=>{const c=[0,0,0,0,0];let nr=0;
    for(const a of as){const i=info(a,mid,t);if(i.best==null)continue;if(i.band)c[grp(i.band.ix)]++;else nr++}return[t.n+". "+t.name].concat(c.map(String),[String(nr)])})});
  rep.blocks.push({h:"Resultados por atleta",head:["Atleta","Idade"].concat(ts.map(t=>t.n+". "+t.name)),rows:as.map(a=>{const age=ageAt(a.birth,(ev(a,mid)||{}).date);
    return[a.name,age==null?"–":String(age)].concat(ts.map(t=>{const i=info(a,mid,t);return i.best==null?"–":fmtV(t,i.best)+" | "+(i.band?i.band.label:"sem referência")}))})});
  rep.blocks.push({h:"Notas de leitura",list:["As médias são calculadas teste a teste, cada uma na sua unidade. Não existe nota global.","A faixa de percentil usa a idade de cada atleta na data da sua avaliação.","Fontes: "+ts.map(t=>t.n+" · "+t.src).join("; ")+"."]});
  return rep;
}
function repHtml(r){

function repPdf(r){
  const land=r.blocks.some(b=>b.head&&b.head.length>6);
  const d=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:land?"landscape":"portrait"}),M=14,PW=land?297:210,PH=land?210:297,W=PW-2*M;
  const INK=[20,39,78],MUT=[86,103,138],ACC=[232,100,27],LINE=[211,220,233];
  const tx=s=>String(s).replace(/[–−]/g,"-").replace(/↑/g,"").replace(/ \| /g,"\n");
  let y=0;
  const need=h=>{if(y+h>PH-14){d.addPage();y=16}};
  d.setFillColor(...INK);d.rect(0,0,PW,30,"F");
  d.setTextColor(255,255,255);d.setFont("helvetica","normal");d.setFontSize(9);d.text(tx("Plataforma de Avaliação Quantitativa · "+r.title),M,10);
  d.setFont("helvetica","bold");d.setFontSize(18);d.text(tx(r.sub),M,21);
  let lx=PW-M;for(const k of ["fpb","enb"]){const L=LOGO[k],h=20,w=h*L.r;lx-=w+2;try{d.setFillColor(255,255,255);d.roundedRect(lx-1.5,3.5,w+3,h+3,1.5,1.5,"F");d.addImage(L.src,"JPEG",lx,5,w,h)}catch(e){}lx-=3}
  d.setFillColor(...ACC);d.rect(0,30,PW,1.5,"F");y=40;
  const cw=W/3;
  r.meta.forEach((m,k)=>{const x=M+(k%3)*cw,yy=y+Math.floor(k/3)*11;d.setFont("helvetica","normal");d.setFontSize(8);d.setTextColor(...MUT);d.text(tx(m[0]),x,yy);d.setFontSize(10.5);d.setTextColor(...INK);d.text(tx(m[1]),x,yy+4.5)});
  y+=Math.ceil(r.meta.length/3)*11+3;
  for(const b of r.blocks){
    need(16);d.setFont("helvetica","bold");d.setFontSize(12);d.setTextColor(...ACC);d.text(tx(b.h),M,y);y+=5.5;
    if(b.head){
      const n=b.head.length,first=Math.min(W*0.3,48),other=(W-first)/(n-1),xs=[M];for(let k=1;k<n;k++)xs.push(M+first+(k-1)*other);
      const rowOut=(cells,bold)=>{
        d.setFont("helvetica",bold?"bold":"normal");d.setFontSize(8.5);
        const ls=cells.map((c,k)=>d.splitTextToSize(tx(c),(k?other:first)-2)),h=Math.max(...ls.map(l=>l.length))*3.7+2.6;
        need(h);d.setTextColor(...(bold?MUT:INK));
        ls.forEach((l,k)=>d.text(l,xs[k],y+3.4));
        y+=h;d.setDrawColor(...LINE);d.setLineWidth(0.2);d.line(M,y-0.6,M+W,y-0.6);
      };
      rowOut(b.head,true);b.rows.forEach(row=>rowOut(row,false));y+=5;
    }else{
      d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(...INK);
      for(const l of b.list){const ls=d.splitTextToSize("•  "+tx(l),W-2);need(ls.length*4.6+1.5);d.text(ls,M,y);y+=ls.length*4.6+1.5}
      y+=4;
    }
  }
  const pages=d.getNumberOfPages();
  for(let p=1;p<=pages;p++){d.setPage(p);d.setFont("helvetica","normal");d.setFontSize(8);d.setTextColor(...MUT);d.text(tx("Gerado em "+fmtD(today())+" · Bateria de testes ENB, Avaliação Quantitativa · Página "+p+" de "+pages),M,PH-7)}
  return d.output("arraybuffer");
}

  $("#teamline").textContent=(state.config.team?state.config.team+" · ":"")+"Avaliação técnica · Basquetebol de formação";
  $("#escseg").innerHTML=Object.keys(ESC).map(k=>`<button data-act="esc" data-id="${k}" aria-pressed="${k===ui.esc}">${ESC[k]}</button>`).join("");
  $("#momsel").innerHTML=MOMS.map(m=>`<option value="${m.id}"${m.id===ui.mid?" selected":""}>${m.label}</option>`).join("");
  $("#tabs").innerHTML=[["equipa","Equipa"],["ficha","Ficha individual"],["rel","Relatórios"],["testes","Testes"]].map(t=>`<button data-act="tab" data-id="${t[0]}"${t[0]===ui.tab?' aria-current="page"':""}>${t[1]}</button>`).join("");
  let top="";
  if(ui.pending){const p=ui.pending,n=Object.keys(p.athletes).length,cur=Object.keys(state.athletes).length;
    top=`<section class="card notice flash"><div><b>Importar cópia de ${esc(p.date||"data desconhecida")}</b><br><span class="small">${n} ${n===1?"atleta":"atletas"} no ficheiro. Neste momento tens ${cur}. Substituir apaga os dados atuais; Juntar mantém-nos e acrescenta os do ficheiro.</span></div>
    <div class="row"><button class="btn primary" data-act="impReplace">Substituir tudo</button><button class="btn" data-act="impMerge">Juntar aos atuais</button><button class="btn" data-act="impCancel">Cancelar</button></div></section>`}
  else if(ui.flash){top=`<p class="notice">${esc(ui.flash)}</p>`;ui.flash=""}
  $("#app").innerHTML=top+(ui.tab==="equipa"?viewEquipa():ui.tab==="ficha"?viewFicha():ui.tab==="testes"?viewTestes():viewRel());
}

/* ---------- equipa de exemplo: valores tirados das próprias tabelas, marcados como exemplo ---------- */
function loadSample(){
  const e=ui.esc,y=new Date().getFullYear()-(+e);
  ["A","B","C","D"].forEach((n,k)=>{
    const a={id:uid("a")+k,name:"Atleta de exemplo "+n,birth:y+"-"+["11","09","12","10"][k]+"-15",esc:e,ex:true,evals:{m1:{date:today(),note:"",r:{}}}};
    const ag=ageAt(a.birth,today());
    for(const t of bat(e)){const r=t.ref[ag];if(r)a.evals.m1.r[t.id]=[r[(k*2+TESTS.indexOf(t))%9]]}
    state.athletes[a.id]=a;save(a.id);
  });
  ui.mid="m1";
}

/* ---------- cópia de segurança, impressão e ficheiros ---------- */
const slug=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
async function offerFile(name,data,mime){
  if(dl){await dl.save({filename:name,data});return}
  if(!STANDALONE)throw{code:"unavailable"};
  const u=URL.createObjectURL(new Blob([data],{type:mime})),l=document.createElement("a");
  l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}
function fileErr(e,what){return e&&e.code==="declined"?"":"Não foi possível guardar "+what+" nesta vista."}
async function exportCopy(){
  const data={app:"plataforma-avaliacao-quantitativa",versao:1,data:today(),config:state.config,athletes:state.athletes};
  try{await offerFile("copia-avaliacao-quantitativa-"+today()+".json",JSON.stringify(data,null,1),"application/json");ui.flash="Cópia de segurança guardada: "+Object.keys(state.athletes).length+" atletas."}
  catch(e){ui.flash=fileErr(e,"a cópia")}
  render();
}
function readCopy(file){
  const r=new FileReader();
  r.onload=()=>{
    let o=null;try{o=JSON.parse(r.result)}catch(e){}
    const ok=o&&o.app==="plataforma-avaliacao-quantitativa"&&o.athletes&&typeof o.athletes==="object"&&Object.values(o.athletes).every(a=>a&&typeof a.id==="string"&&typeof a.name==="string");
    if(!ok){ui.pending=null;ui.flash="Este ficheiro não é uma cópia desta plataforma. Escolhe um ficheiro criado com «Exportar cópia»."}
    else ui.pending={date:fmtD(o.data),config:o.config||null,athletes:o.athletes};
    render();window.scrollTo(0,0);
  };
  r.onerror=()=>{ui.flash="Não foi possível ler o ficheiro.";render();window.scrollTo(0,0)};
  r.readAsText(file);
}
function applyCopy(replace){
  const p=ui.pending;ui.pending=null;if(!p)return;
  if(replace){for(const id of Object.keys(state.athletes))if(!p.athletes[id]){delete state.athletes[id];save(id)}if(p.config)state.config=clone(p.config)}
  let n=0;for(const [id,a] of Object.entries(p.athletes)){if(id!==a.id)continue;state.athletes[id]=clone(a);n++}
  normalize();save("config");for(const id of Object.keys(p.athletes))if(state.athletes[id])save(id);
  const withAth=Object.keys(ESC).find(k=>byEsc(k).length);if(withAth&&!byEsc(ui.esc).length)ui.esc=withAth;
  ui.aid=null;ui.flash=(replace?"Dados substituídos pela cópia: ":"Cópia junta aos dados atuais: ")+n+" atletas importados.";
}
/* Imprimir / PDF: no site do GitHub abre a impressão do navegador; dentro do Claude guarda em PDF o relatório da vista atual */
async function printView(){
  if(STANDALONE&&typeof window.print==="function"){window.print();return}
  let r=null;
  if(ui.tab==="ficha"&&state.athletes[ui.aid])r=repInd(state.athletes[ui.aid],ui.mid);
  else if(ui.tab==="equipa"&&byEsc(ui.esc).length)r=repTeam(ui.esc,ui.mid);
  else if(ui.tab==="rel")r=curRep;
  if(!r){ui.tab="rel";ui.flash=byEsc(ui.esc).length?"Escolhe o relatório e carrega de novo em «Imprimir / PDF».":"Junta atletas para poderes gerar relatórios.";render();return}
  if(!window.jspdf){ui.flash="O gerador de PDF não carregou. Verifica a ligação à internet.";render();return}
  try{await offerFile(slug(r.file)+".pdf",repPdf(r),"application/pdf");ui.flash="PDF guardado: "+r.title.toLowerCase()+"."}
  catch(e){ui.flash=fileErr(e,"o PDF")}
  render();
}

/* ---------- eventos ---------- */
document.addEventListener("click",async evn=>{
  const b=evn.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==="esc"){ui.esc=id;ui.confirmDel=false}
  else if(act==="tab"){ui.tab=id;ui.confirmDel=false}
  else if(act==="jump"){const el=document.getElementById("d-"+id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
  else if(act==="desc"){ui.tab="testes";render();const el=document.getElementById("d-"+id);if(el)el.scrollIntoView({block:"start"});return}
  else if(act==="rep")ui.rep=id;
  else if(act==="open"){ui.aid=id;ui.tab="ficha"}
  else if(act==="toRep"){ui.tab="rel";ui.rep="ind"}
  else if(act==="add"){
    const n=$("#newName").value.trim(),bd=$("#newBirth").value;
    if(!n){ui.msg="Escreve o nome do atleta antes de o juntares."}
    else{const a={id:uid("a"),name:n,birth:bd||"",esc:ui.esc,evals:{}};state.athletes[a.id]=a;save(a.id);if(!bd)ui.msg=n+" foi adicionado sem data de nascimento. Preenche-a na ficha para obter as faixas de percentil."}
  }
  else if(act==="sample")loadSample();
  else if(act==="unsample"){for(const a of Object.values(state.athletes))if(a.ex){delete state.athletes[a.id];save(a.id)}}
  else if(act==="del")ui.confirmDel=true;
  else if(act==="delNo")ui.confirmDel=false;
  else if(act==="delYes"){delete state.athletes[ui.aid];save(ui.aid);ui.aid=null;ui.confirmDel=false;ui.tab="equipa"}
  else if(act==="export"){exportCopy();return}
  else if(act==="import"){const f=$("#impfile");f.value="";f.click();return}
  else if(act==="impReplace")applyCopy(true);
  else if(act==="impMerge")applyCopy(false);
  else if(act==="impCancel")ui.pending=null;
  else if(act==="print"){printView();return}
  else if(act==="pdf"){
    if(!curRep)return;const msg=$("#repmsg");
    try{await offerFile(slug(curRep.file)+".pdf",repPdf(curRep),"application/pdf");msg.textContent="PDF guardado"}
    catch(e){msg.textContent=fileErr(e,"o PDF")}
    return;
  }
  render();
});
document.addEventListener("change",evn=>{
  const el=evn.target,ch=el.dataset&&el.dataset.ch,v=el.value,a=state.athletes[ui.aid];
  if(el.id==="impfile"){if(el.files&&el.files[0])readCopy(el.files[0]);return}
  if(el.id==="momsel"){ui.mid=v;ui.confirmDel=false;render();return}
  if(!ch)return;
  if(ch==="try"){
    if(!a)return;
    const t=T[el.dataset.t],e=ensureEval(a,ui.mid),raw=String(v).trim().replace(",",".");
    let n=raw===""?null:parseFloat(raw);
    if(n!=null){
      if(!isFinite(n)||n<0)n=null;
      else if(t.unit==="s")n=n>0&&n<600?Math.round(n*100)/100:null;
      else n=Math.round(n)<=t.max?Math.round(n):null;
    }
    if(!e.r[t.id])e.r[t.id]=[];
    e.r[t.id][+el.dataset.k]=n;for(let k=0;k<t.tries;k++)if(e.r[t.id][k]===undefined)e.r[t.id][k]=null;
    el.value=n==null?"":String(n).replace(".",",");
    save(a.id);
    /* atualiza só os painéis de leitura, para não perder o foco durante o registo */
    $("#res-"+t.id).innerHTML=resHtml(a,t);$("#side").innerHTML=sideHtml(a);
    return;
  }
  if(ch==="pick"){ui.aid=v;ui.confirmDel=false}
  else if(ch==="bat"){
    const l=state.config.bat[ui.esc],id=el.dataset.t;
    if(el.checked){if(!l.includes(id))l.push(id);l.sort((x,y)=>TESTS.indexOf(T[x])-TESTS.indexOf(T[y]))}
    else if(l.length<=1)ui.msg="A bateria "+ESC[ui.esc]+" precisa de pelo menos um teste.";
    else l.splice(l.indexOf(id),1);
    save("config");
  }
  else if(ch==="team"){state.config.team=v.trim();save("config")}
  else if(a&&ch==="aName"){if(v.trim()){a.name=v.trim();save(a.id)}}
  else if(a&&ch==="aBirth"){a.birth=v;save(a.id)}
  else if(a&&ch==="aEsc"){a.esc=v;ui.esc=v;save(a.id)}
  else if(a&&ch==="evDate"){if(v){ensureEval(a,ui.mid).date=v;save(a.id)}}
  render();
});
document.addEventListener("input",evn=>{
  if(evn.target.dataset&&evn.target.dataset.in==="note"){const a=state.athletes[ui.aid];if(a){ensureEval(a,ui.mid).note=evn.target.value;save(a.id)}}
});
document.addEventListener("keydown",evn=>{if(evn.key==="Enter"&&(evn.target.id==="newName"||evn.target.id==="newBirth")){const b=document.querySelector('[data-act="add"]');if(b)b.click()}});

/* ---------- arranque ---------- */
async function init(){
  let db=null,user=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,user,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")])}catch(e){}
  }
  let id=null;try{id=user?await user.id():null}catch(e){}
  if(db&&id){
    try{
      col=db.collection("data/users/"+id);
      const snap=await col.limit(1000).get();
      snap.docs.forEach(d=>{const v=clone(d.data());if(d.id==="config")state.config=v;else state.athletes[d.id]=v});
      mode="db";
    }catch(e){col=null;mode="local"}
  }
  if(mode==="local"){
    try{const raw=localStorage.getItem(LS_KEY);if(raw){const s=JSON.parse(raw);state.config=s.config;state.athletes=s.athletes||{}}}catch(e){}
  }
  normalize();
  const withAth=Object.keys(ESC).find(k=>byEsc(k).length);if(withAth)ui.esc=withAth;
  for(const m of MOMS)if(Object.values(state.athletes).some(a=>hasAny(a,m.id)))ui.mid=m.id;
  idleStatus();render();
}
init();
</script>
